[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-x"
version = "0.1.0"
description = "Resilient decentralized BVLOS disaster-response swarm simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["uav_x*"]

[project.scripts]
uav-x-sim = "uav_x.simulation.runner:main"
uav-x-view = "uav_x.visualization.operations_2d:render"

[tool.pytest.ini_options]
testpaths = ["tests"]
