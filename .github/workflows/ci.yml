name: UAV-X CI

on:
  push:
  pull_request:

jobs:
  python-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: python -m uav_x.simulation.runner --scenario scenarios/baseline.yaml --policy heuristic
      - run: python -m uav_x.visualization.operations_2d runs/uav_x_run.jsonl
