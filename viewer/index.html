<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>UAV-X Realistic Mission Viewer</title></head>
<body><div id="app"><header><strong>UAV-X</strong><span>RESILIENT BVLOS SWARM</span><label>Replay <input id="file" type="file" accept=".json,.jsonl"></label><label>Quality <select id="quality"><option value="auto">Auto</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label><button id="camera">Overview</button><button id="play">▶ Play</button><label>Speed <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="5">5×</option></select></label><input id="seek" type="range" min="0" max="0" value="0"></header><section id="mission-story"><h2>MISSION STORY</h2><strong id="mission-phase">Load a replay</strong><p id="mission-objective">The swarm will appear here once a replay is loaded.</p><div id="mission-events"></div></section><aside id="telemetry">Load a replay JSON to begin.</aside><section id="legend"><b>HOW TO READ THIS</b><span>🟢 Survey UAV / footprint</span><span>🔷 Backbone relay UAV</span><span>🔵 GCS route</span><span>🟠 Emergency PoI</span><span>┅ assigned survey</span><span>Vertical stem = altitude</span></section><div id="event-banner"></div><main id="viewport"></main></div><script type="module" src="/src/main.js"></script></body>
</html>
